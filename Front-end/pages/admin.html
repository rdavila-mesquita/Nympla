<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin</title>
    <link rel="icon" type="image/png" href="/imgs/icon-dark.png">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body data-bs-theme="dark" onload="onLoadPage()">
      <nav class="navbar bg-body-tertiary">
        <a class="navbar-brand ms-3"><img src="/imgs/logo.png" alt=""></a>
        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
          <button id="btnLogout" type="button" class="btn btn-primary me-3">Logout</button>
        </div>
      </nav>
    <p class="eventosCadastrados m-3">Eventos cadastrados</p>
    <div class="container my-5">
      <div id="cardEvents" class="row justify-content-center"></div>
    </div>

    <div id="modal" class="modal fade" tabindex="-1">
      <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content bg-dark text-white">
          <div class="modal-header">
            <h5 class="modal-title">Participantes do Evento</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fechar"></button>
          </div>
          <div class="modal-body" id="subscriptions"></div>
          <div class="modal-footer">
          </div>
        </div>
      </div>
    </div>
    
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/admin.js"></script>
  </body>
</html>
