<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile</title>
    <link rel="icon" type="image/png" href="/imgs/icon-ligth.png">
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  </head>
  <body data-bs-theme="light" onload="onLoadPage()">
        <nav class="navbar bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand"><img src="/imgs/logo.png" alt=""></a>
        <form class="d-flex" role="search">
          <input id="searchInput" class="form-control me-0" type="search" placeholder="Pesquise um evento..." aria-label="Search">
          <div class="btn-group" role="group" aria-label="Basic outlined example">
            <button id="btnBuscar" type="button" class="btn btn-outline-primary">Buscar</button>
            <button id="btnLimpar" type="button" class="btn btn-outline-primary">Limpar</button>
            
          </div>
          <button id="btnLogout" type="button" class="btn btn-primary ms-3">Logout</button>
        </form>
      </div>
    </nav>

    <div class="card text-center">
      <div class="card-header">
        <ul class="nav nav-tabs card-header-tabs">
          <li class="nav-item">
            <a class="nav-link active" aria-current="true" href="profile.html">Eventos disponíveis</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="subscriptions.html">Minhas Inscrições</a>
          </li>
        </ul>
      </div>
    </div>
    <div class="container my-5">
      <div id="cardEvents" class="row justify-content-center"></div>
    </div>

    <div id="modal" class="modal fade" tabindex="-1">
      <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Detalhes do Evento</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body" id="detalhes">
            <p></p>
          </div>
          <div class="modal-footer">
          </div>
        </div>
      </div>
    </div>
    


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/profile.js"></script>
  </body>
</html>
